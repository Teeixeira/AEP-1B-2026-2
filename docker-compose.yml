services:
  mongo:
    image: mongo:8
    container_name: aep-mongo
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aep-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    depends_on:
      - mongo

volumes:
  mongo_data: